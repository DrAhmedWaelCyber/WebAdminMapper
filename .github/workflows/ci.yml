name: WebAdminMapper CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.8", "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Code Syntax & Compilation Check
        run: |
          python -m compileall web_mapper tests benchmarks main.py setup.py

      - name: Run Unit & Integration Test Suite
        run: |
          python -m unittest discover tests

      - name: Run Reproducible Benchmark Smoke Test
        run: |
          python benchmarks/benchmark_suite.py --quick

      - name: Validate Local Package Installation & Entrypoint
        run: |
          pip install -e .
          webadminmapper --version
          webadminmapper --help
