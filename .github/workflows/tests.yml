name: Tests & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies & Package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest

      - name: Run Unit Tests
        run: |
          pytest tests/test_config.py tests/test_generator.py tests/test_crawler.py tests/test_heuristics.py tests/test_security_assertions.py tests/test_security_audit.py tests/test_compliance.py tests/test_reporter.py tests/test_rate_limiter.py tests/test_network_diag.py tests/test_checkpoint.py tests/test_sitemap.py tests/test_requester.py tests/test_engine.py tests/test_benchmarks.py -v

      - name: Run Soft-404 & Heuristic Validation Suite
        run: |
          pytest tests/test_heuristic_validation.py -v

      - name: Run Integration Tests Against Local Server
        run: |
          pytest tests/test_integration.py -v

      - name: Run Linting & Syntax Verification
        run: |
          python -m compileall web_mapper tests benchmarks setup.py main.py

      - name: Validate CLI Binary & Package Installation
        run: |
          webadminmapper --version
          webadminmapper --help
          python benchmarks/benchmark_suite.py --quick
